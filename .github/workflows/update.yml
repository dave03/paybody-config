name: Update tax config

on:
  schedule:
    - cron: "0 3 1 * *"   # רץ ב־1 לחודש ב־03:00 UTC
  workflow_dispatch:       # מאפשר הפעלה ידנית

jobs:
  update-config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run update script
        run: |
          node update_tax_config.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add tax_config.json
          git commit -m "Automated update of tax_config.json" || echo "No changes to commit"
          git push
